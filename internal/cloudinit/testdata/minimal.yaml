#cloud-config
# closedvps first-boot setup for vps. Generated by closedvps test.
# The Hetzner Cloud Firewall in front of this server has no inbound rules, so nothing below opens it to the
# internet. Progress and errors: /var/log/cloud-init-output.log

hostname: "vps"
ssh_pwauth: false
disable_root: true

users:
  - name: "dev"
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK3p23RMzU7qduY/lH9cE1rnbYIsm4BHn7aXTe0mfbc1 me@laptop"

package_update: true
package_upgrade: true
packages:
  - unattended-upgrades
  - curl
  - ca-certificates
  - nftables

write_files:
  - path: /etc/ssh/sshd_config.d/10-closedvps.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowUsers dev
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/apt/apt.conf.d/52closedvps
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
      // First boot: wait for the daily apt run instead of failing on its lock.
      DPkg::Lock::Timeout "600";
  # Docker, if installed later, publishes container ports on 127.0.0.1 unless told otherwise.
  - path: /etc/docker/daemon.json
    content: |
      { "ip": "127.0.0.1" }
  # This whole setup, Tailscale key included, stays readable from Hetzner's metadata service for the
  # server's life. Only root (cloud-init) may read it from here on, and containers never can.
  - path: /etc/closedvps/metadata.nft
    content: |
      table inet closedvps_metadata
      delete table inet closedvps_metadata
      table inet closedvps_metadata {
        chain output {
          type filter hook output priority 0; policy accept;
          ip daddr 169.254.169.254 meta skuid != 0 drop
        }
        chain forward {
          type filter hook forward priority 0; policy accept;
          ip daddr 169.254.169.254 drop
        }
      }
  - path: /etc/systemd/system/closedvps-metadata.service
    content: |
      [Unit]
      Description=Let only root reach the Hetzner metadata service
      DefaultDependencies=no
      Before=network-pre.target
      Wants=network-pre.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/sbin/nft -f /etc/closedvps/metadata.nft

      [Install]
      WantedBy=multi-user.target
  # Joins the tailnet once, after the first-boot reboot if there is one, then deletes the key.
  - path: /var/lib/closedvps/tailscale-key
    permissions: "0600"
    content: "tskey-auth-abc123-XYZ"
  - path: /etc/systemd/system/closedvps-join.service
    content: |
      [Unit]
      Description=Join the tailnet with the closedvps auth key
      After=network-online.target tailscaled.service
      Wants=network-online.target
      ConditionPathExists=/var/lib/closedvps/tailscale-key

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/tailscale up --auth-key=file:/var/lib/closedvps/tailscale-key --hostname=vps
      ExecStartPost=/usr/bin/rm -f /var/lib/closedvps/tailscale-key
      Restart=on-failure
      RestartSec=30

      [Install]
      WantedBy=multi-user.target

runcmd:
  - export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
  - systemctl daemon-reload && systemctl enable --now closedvps-metadata.service
  - systemctl restart ssh
  - curl -fsSL --retry 5 https://tailscale.com/install.sh -o /tmp/tailscale-install.sh && sh /tmp/tailscale-install.sh && rm /tmp/tailscale-install.sh
  - systemctl daemon-reload && systemctl enable closedvps-join.service
  # With a kernel update pending, the reboot below starts the join; otherwise join now.
  - test -f /var/run/reboot-required || systemctl start --no-block closedvps-join.service

power_state:
  mode: reboot
  message: closedvps setup done, rebooting for a kernel update
  timeout: 30
  condition: test -f /var/run/reboot-required
