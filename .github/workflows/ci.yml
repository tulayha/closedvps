name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release runs every check here before it publishes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: shellcheck install.sh
        run: shellcheck install/install.sh
      - name: cloud-init schema
        # The golden files are the whole first-boot setup, kept equal to the code by go test.
        run: |
          sudo apt-get install -y cloud-init >/dev/null
          for f in internal/cloudinit/testdata/*.yaml; do cloud-init schema -c "$f"; done

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: fuzz each target for 30s
        run: |
          go test ./internal/alert -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s
          go test ./internal/alert -run '^$' -fuzz '^FuzzCurlConfig$' -fuzztime 30s
          go test ./internal/cloudinit -run '^$' -fuzz '^FuzzRender$' -fuzztime 30s

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gitleaks over the whole history
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        run: pipx run zizmor==1.32.0 --format plain .github/workflows

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false # builds that ship never read a cache another job could have written
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --snapshot --clean --skip=publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 3

  install-scripts:
    needs: snapshot
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot
          path: dist
      - name: serve the build
        shell: bash
        run: |
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          cd dist && $py -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 3
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          CLOSEDVPS_DOWNLOAD_BASE: http://127.0.0.1:8000
          CLOSEDVPS_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh install/install.sh
          "$CLOSEDVPS_INSTALL_DIR/closedvps" version
      - name: install.ps1 in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        env:
          CLOSEDVPS_DOWNLOAD_BASE: http://127.0.0.1:8000
        run: |
          Get-Content install/install.ps1 -Raw | Invoke-Expression
          & "$env:LOCALAPPDATA\Programs\closedvps\closedvps.exe" version
      - name: install.ps1 in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLOSEDVPS_DOWNLOAD_BASE: http://127.0.0.1:8000
        run: |
          Get-Content install/install.ps1 -Raw | Invoke-Expression
          closedvps version
