name: PR title

# PRs are squash-merged, so the title becomes the commit subject, and feat and fix titles become lines in the
# release notes (.goreleaser.yaml). CONTRIBUTING.md has the rules.
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            site
            test
            ci
            build
            chore
            refactor
          # The release notes strip only "feat: " and "fix: ", so no scopes.
          disallowScopes: |
            .+
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            Start the part after the type with a capital letter, as it reads in the release notes:
            "feat: Ask for a tagged Tailscale key".
          ignoreLabels: |
            dependencies
